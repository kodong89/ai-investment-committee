name: 장중 예상 거래량 정확도
on:
  workflow_dispatch:
  push:
    paths: ["scripts/volcurve.py", ".github/workflows/volcurve.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python scripts/volcurve.py
      - name: 변경 시 커밋
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add volcurve.json
          git diff --cached --quiet || (git commit -m "장중 거래량 분포 갱신" && git pull --rebase -q && git push)
