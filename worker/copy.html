<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker 코드 복사</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#00463c;color:#fff;padding:20px}h1{font-size:22px;margin:0 0 6px}p{color:#e6f5c8;margin:0 0 14px;font-size:15px}
button{font:700 18px system-ui;width:100%;min-height:56px;border:0;border-radius:12px;background:#e6f5c8;color:#00463c}
#st{margin:12px 0;font-weight:700;color:#e6f5c8;min-height:24px}textarea{width:100%;height:50vh;box-sizing:border-box;font:12px/1.4 ui-monospace,monospace;border-radius:10px;padding:10px}</style></head>
<body><h1>차트 계산 서버 코드</h1><p>아래 버튼으로 전체를 복사한 뒤 Cloudflare의 Edit code 창에 붙여넣고 Deploy 하세요.</p>
<button id="cp">코드 전체 복사</button><div id="st">불러오는 중…</div><textarea id="code" readonly></textarea>
<script>
const t = document.getElementById("code"), st = document.getElementById("st");
fetch("worker.js?v=" + Date.now()).then(r => r.text()).then(c => { t.value = c; const v = c.match(/VERSION = "(\d+)"/); st.textContent = `버전 ${v ? v[1] : "?"} · ${c.split("\n").length}줄 · 마지막 줄이 } 로 끝나요`; })
  .catch(() => st.textContent = "불러오지 못했어요. 새로고침해 주세요.");
document.getElementById("cp").onclick = async () => {
  try { await navigator.clipboard.writeText(t.value); st.textContent = "복사했어요! Cloudflare에 붙여넣기 하세요."; }
  catch (e) { t.focus(); t.select(); t.setSelectionRange(0, t.value.length); document.execCommand("copy"); st.textContent = "복사했어요(전체 선택됨). 안 되면 길게 눌러 복사하세요."; }
};
</script></body></html>
